# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json
# Fern docs for the Lume backend API. Source of truth for the API reference is the repo's
# openapi.yaml (generated from collection/lume-api.postman_collection.json — see generators.yml).
# Publish with `fern generate --docs` (requires a Fern login) — not run as part of setup.

instances:
  # Proposed slug: "lume-cxm" (matches lume-cxm.com). The slug is global across Fern, so it may already
  # be taken — `fern generate --docs` will say so; change it here if so.
  - url: lume-cxm.docs.buildwithfern.com
    # Optional, once DNS for lume-cxm.com is under your control and the plan allows custom domains:
    # custom-domain: docs.lume-cxm.com

title: Lume | Documentation

navigation:
  - page: Welcome
    path: pages/welcome.mdx
  - api: API Reference
    layout:
      - Health
      - Staff Authentication
      - Departments and Roles
      - Staff Management
      - Property Settings and Guest App CMS
      - Experience Hub Catalog
      - Spa Hub Facilities and Treatments
      - Dining Hub Restaurants and Intimate Dining
      - Food and Beverage Ordering
      - Transport Hub Settings Fleet and Offerings
      - App Banners
      - Guest Management
      - Guest Arrival
      - Arrivals Hub
      - Guest App Session and Discovery
      - Guest App Bookings
      - Payments Razorpay
      - Legacy Experience Bookings
      - Staff Bookings by Hub
      - Service Requests
      - Guest Notifications
      - Checkout and Feedback
      - Home Summary and Analytics
      - Comms Hub
      - Cancellations
      - Teardown

colors:
  accentPrimary:
    dark: '#E8B04B'
    light: '#93600F'
  background:
    dark: '#0B0D10'
    light: '#FFFFFF'
