      summary: Add manual whole-stay transport booking
      description: |-
        Staff-entered booking: created `confirmed` + `paid`, `staffSeen: true`. Nights derived from the stay dates. Saves `staffTransportBookingId`.

        **Type:** WRITE (mutates state)
        **Auth:** Bearer staff JWT — sent as `Authorization: Bearer {{authToken}}` (collection-level auth)
        **Depends on:** "Add guest" (11)

        Resolves the stay through the shared `resolveMainStayBooking` lookup (like every other hub) and stores `mainStayBookingId`, so the booking appears in Stay Activity (18.7) and the Checkout folio (21). It also keeps the legacy `bookingId: Booking._id` link.
      requestBody:
        content:
