openapi: 3.0.0
info:
  title: LUME Backend API
  description: |
    # LUME backend API — end-to-end runnable flow

    Generated from the Express routes in `src/routes/*` and the controllers/models behind them (182 routes, 200 requests including error-path variants). Import, fill in the four **collection variables** below, then run the collection **top to bottom** (Collection Runner) against a **development** server and database.

    ## Quick start
    1. Set collection variable **`baseUrl`** (default `http://localhost:3000`; the server's `PORT` defaults to 3000).
    2. Set **`staffEmail`** and **`staffPassword`** to an existing **Admin or GM** account on the dev DB (`npm run seed` creates demo accounts — see `scripts/seed/people.js`). No credentials are stored in this file.
    3. Run. Folder `01` logs in and stores the JWT in `authToken`; every later request authenticates through the collection-level Bearer auth.

    ## Authentication
    * **Staff (dashboard):** stateless JWT. `POST /api/auth/login` (`{email, password}`) returns `{ token, staff }`. Send `Authorization: Bearer {{authToken}}` on **every `/api/dashboard/*`** route and `GET /api/auth/me`. The middleware re-loads the staff record on each call and returns `403` for inactive accounts. Tokens carry `{staffId, role, propertyId}`, signed HS256 with the server's `JWT_SECRET`, and **no expiry**. Some routes additionally require tier `Admin` / `GM` (`requireTier`) — noted per request.
    * **Guests (guest app):** **no authentication at all** on `/api/guests/*`, `/api/checkin/*`, `/api/experiences/*`, `/api/bookings/*`, `/api/payments/*`. The guest's identity is just the `guestId` (Mongo id) or the secret `bookingToken` in the check-in link. Those requests are marked "public" and override the collection auth with *No Auth*.
    * `POST /api/auth/login` is therefore the mandatory first call; **its Tests script** sets `authToken`, `staffId`, `staffTier` via `pm.collectionVariables`.

    ## How the flow chains
    Variables are captured by each request's Tests script (`experienceId`, `guestId`, `guestToken`, `stayDocId`, `stayBookingId`, `checkInId`, `expBookingId`, …). Order: **auth → departments/staff → property settings → catalog (experiences, spa, dining, F&B, transport, banners) → guest/stay creation → guest check-in → staff check-in review → guest app discovery → guest bookings → payments → staff-side hub bookings → service requests → notifications → checkout & feedback → analytics → comms → cancellations → teardown.** Each request's description states its **Type** (READ/WRITE), **Auth**, and **Depends on**. Deliberate error-path requests are prefixed "⚠ Error path" and sit at the end of their folder.

    **One stay = one Booking ID.** `POST /dashboard/guests` creates the stay; its `bookingId` (`EB-<year>-9NNNN`, generated in a pre-request script so re-runs never collide) is `{{stayBookingId}}` and is used everywhere. Hub bookings link to it through `mainStayBookingId`.

    ## 🚫 UNTESTED BY DESIGN — five external-service features
    These requests are embedded in the collection so the API surface is documented, but they have **NOT been run or verified through this collection**, and nothing here should be read as evidence that they work. Each depends on a live external service or has a real-money / real-email side effect. Their saved example responses are hand-written from the controller code, not captured from real runs. All are **skipped by default** (`pm.execution.skipRequest()`, Postman ≥ 10.18) unless you set the variable shown; each request's description repeats this and names the service to verify against.

    | Switch (default `false`) | Verify manually against | Why it is untested | Requests |
    |---|---|---|---|
    | `enableUploads` | Cloudflare R2 / Cloudinary (+ ffmpeg for video) | uploads real files to storage; ID upload → submit → per-guest review depend on it | 13: Upload gallery image; Upload experience image; Upload experience video; Upload spa image; Upload dining image; Upload dining menu file; Upload category image; Upload dish image; Upload vehicle image; Upload banner image; Upload guest ID (front + optional back); Complete check-in (submit for review); Review one guest's ID |
    | `enableRazorpay` | Razorpay | live payment provider, real-money side effect, needs a real Checkout payment | 4: Create Razorpay order; Verify payment; Razorpay webhook; ⚠ Error path — Verify with a forged signature |
    | `enableAiChat` | OpenAI | paid API; can create requests/notifications | 1: AI concierge chat (may raise a request) |
    | `enableEmailSend` | Resend | sends a real email | 1: Send a test email |
    | `enableBulkImport` | LeadSquared / database | external CRM push per row; created ids not returned | 1: Bulk-import guests (CSV/XLSX rows) |

    Everything outside this table is intended to be run end to end. Two other gates exist but are **not** untested-by-design: `enableTeardown` (default **true**; set it to `false` to keep the data the run created) and `fbOrderId`, which you must set yourself before "Advance order stage" will run.
    A skipped request on older Postman versions will simply run and return the documented error.

    ## Response envelope
    Success: `{ "success": true, "data": …, "count"?: n, "message"?: "…" }`. Failure: `{ "success": false, "message": "…" }`, plus `error` (the raw exception text) on 500s, plus `code` on the staff login errors. Malformed ObjectIds surface as `500` with a Mongoose `CastError` — there is no request-validation layer; validation errors also arrive as 500 (or 400 for experiences).

    ## ⚠ Routes I was not fully confident how to classify (flagged, not guessed silently)
    * **`POST /api/payments/webhook`** — Razorpay-to-server callback; signature is over the *re-serialised* body with the API secret, so it is not reproducible from Postman. Classified WRITE / external.
    * **`POST /api/payments/create-order` & `/verify`** — need real Razorpay Checkout output; classified WRITE, gated by `enableRazorpay`.
    * **`POST /api/guests/auth`** — named "auth" but issues no token; it is an upsert-by-email that also bumps `totalVisits`. Classified WRITE.
    * **`POST /api/guests/chat`** — chat answer *and* conditional ServiceRequest/Notification creation (paid OpenAI call). Classified WRITE.
    * **`DELETE` on `/api/experiences/bookings/:id`, `/api/guests/spa/bookings/:id`, `/api/guests/transport/bookings/:id`, `/api/guests/dining/reservations/:id`** — soft-cancels, not deletes. Likewise `DELETE /dashboard/spa/:id` and `/dashboard/banners/:id` (soft, `isActive:false`). Classified WRITE.
    * **GETs that write (lazy-create defaults):** `GET /api/guests/transport`, `/dashboard/transport`, `/dashboard/property-settings`, `/dashboard/property-settings/guest-app`, `/dashboard/feedback/settings`, `/dashboard/fb-ordering-settings`. Classified READ (idempotent side effect).
    * **Legacy/overlapping:** the whole `/api/bookings/*` router (overlaps `POST /api/experiences/bookings`), `PUT /dashboard/guests/:guestId/review` (superseded by the per-guest check-in review) and `GET /dashboard/analytics` (superseded by `/analytics/overview`, and its check-in block likely no longer matches). I could not tell whether a client still calls them.
    * **No creator routes:** nothing in this API creates an `FbOrder` (in-room orders) or a guest `Feedback` review, so those hubs are read/advance-only here.
    * **`PUT /dashboard/restaurants/:id/block-dates`** writes `blockedRanges` but the guest availability checks read `blockedDates` — may not actually block anything.
    * **`GET /api/checkin/by-guest`** — implemented inline in the route file, not a controller. Classified READ.

    ## Other things worth knowing (not classification, but you will hit them)
    * Every hub booking (guest and staff, all four hubs) now derives `mainStayBookingId` server-side from the stay — a client-sent value is honoured only if it belongs to that guest. **TODO (deferred, tracked in the backend README "Known gaps"):** the legacy `POST /api/bookings/create` (folder 17) still does not set it, so bookings made through it are missing from Stay Activity and the Checkout folio.
    * Client-supplied prices are trusted in `POST /experiences/bookings` (`price`), `POST /guests/transport/book` (`amount`) and `POST /payments/create-order` (`amount`); `PUT /api/bookings/:id/payment` can mark any booking paid with no verification.
    * Fields written that are missing from the schema (silently dropped): `whatsappOptIn` on guest preferences.
    * Server-generated hub refs follow the seed's `<stay ID>-<KIND>-<n>` convention via the shared `src/utils/hubRef.js` (Spa `-SPA-`, Experience `-EXP-`, Transport `-TRN-`, Dining `-DIN-`). A guest with no stay on file gets a non-stay fallback ref (`<KIND>-<timestamp>-<rand>`). Data created by this collection is wiped by the next `npm run seed`.
    * The bare test IDs, emails (`@example.com`) and hostnames in the saved examples are illustrative; the JWT/token values shown are placeholders, not real credentials.
  version: 1.0.1
servers:
  - url: http://localhost:3000
    description: Local development server (collection variable {{baseUrl}})
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
tags:
  - name: 00 · Health
    description: Liveness probe. Not part of `/api`, no auth. Run first to confirm `{{baseUrl}}` is reachable.
  - name: 01 · Staff Authentication
    description: |-
      Staff-side (dashboard) authentication. **`POST /api/auth/login` is the mandatory first call** — it is the only endpoint that issues a token.

      **Mechanism:** stateless JWT (`jsonwebtoken`, HS256, signed with the server's `JWT_SECRET`, payload `{staffId, role, propertyId}`; **no `expiresIn` is set**). Every `/api/dashboard/*` route and `GET /api/auth/me` require `Authorization: Bearer <token>`; the middleware then re-loads the Staff document and rejects inactive accounts.

      The login request's **Tests** script stores `token` in the collection variable `authToken`, so every later request authenticates automatically (collection-level Bearer auth = `{{authToken}}`). Guest-facing routes (`/api/guests/*`, `/api/checkin/*`, `/api/experiences/*`, `/api/bookings/*`, `/api/payments/*`) use **no auth at all**.

      Before running: set collection variables `staffEmail` and `staffPassword` (an existing Admin or GM account on your **dev** database).
  - name: 02 · Departments & Roles
    description: |-
      Fully custom departments/roles per property plus the **hub-access matrix** (`access[role][hubName] = boolean`). Requests are routed to departments by name, so **create the department here before Staff (03) or Service Requests (19)**.

      Depends on: Auth (01), an Admin/GM token. `GET /staff/me/access` is open to any authenticated staff member.

      Deleting a department is in **Teardown (99)** because staff/requests reference it.
  - name: 03 · Staff Management
    description: |-
      Staff accounts (three tiers: `Admin`, `GM`, `Staff`). Route gate: `Admin`/`GM` only. Finer "who can manage whom" is enforced in the controller (a GM cannot create/edit/remove an Admin). The Staff Log is **Admin only**.

      Depends on: Auth (01) and a department + role that exist (02) — Staff accounts are rejected if the department/role does not exist for the property. Removing staff is in **Teardown (99)**.
  - name: 04 · Property Settings & Guest App CMS
    description: |-
      Per-property configuration edited from the dashboard: check-in/out times, story/rules/facilities, gallery, Wi-Fi, directory, comms config, and the **Guest App CMS blob** (`guestApp`). The guest app reads the public subset via `GET /api/guests/property-settings` (folder 14).

      Depends on: Auth (01). `checkOutTime` here feeds the Checkout Hub's standard checkout time (21). ⚠ Unlike most dashboard routes, **`PUT` reads `propertyId` from the query string, not the body**.
  - name: 05 · Experience Hub — Catalog
    description: |-
      Staff-side management of bookable experiences (activities), their discounts and blocked dates. Catalog setup: create the catalog **before** the guest journey (folders 11–18) because guests book against these records. Deletes live in **Teardown (99)**.

      Depends on: Auth (01). Feeds: Guest App discovery (14), guest/staff experience bookings (15, 18).
  - name: 06 · Spa Hub — Facilities & Treatments
    description: |-
      Spa facilities → categories → treatments (with durations/prices/capacity). Catalog setup: create the catalog **before** the guest journey (folders 11–18) because guests book against these records. Deletes live in **Teardown (99)**.

      Depends on: Auth (01). Feeds: guest spa booking (15), staff spa booking (18).
  - name: 07 · Dining Hub — Restaurants & Intimate Dining
    description: |-
      Two facility types share one collection: `restaurant` (info only) and `intimate_dining` (bookable, priced, limited tables per night). Catalog setup: create the catalog **before** the guest journey (folders 11–18) because guests book against these records. Deletes live in **Teardown (99)**.

      Depends on: Auth (01). Feeds: guest dining (15), staff reservations (18).
  - name: 08 · F&B In-Room Ordering — Menu & Settings
    description: |-
      In-room dining menu tree: **Category → Subcategory → Dish**, plus ordering settings (hours, pause, packaging fee) and the order queue. Catalog setup: create the catalog **before** the guest journey (folders 11–18) because guests book against these records. Deletes live in **Teardown (99)**.

      Depends on: Auth (01). ⚠ **No route in this API creates an `FbOrder`** (no guest-facing order endpoint exists), so the order queue is only populated by seed data / another service. Deleting categories/subcategories cascades to dishes.
  - name: 09 · Transport Hub — Settings, Fleet & Offerings
    description: |-
      Two overlapping features on one `Transport` document per property: (a) the legacy **"How to Reach" flat-rate** settings/pricing tiers used by the guest app, and (b) the newer **Transport Hub** — fleet (`vehicles`), 4 fixed offering slots (1 sightseeing day, 2 pickup/drop, 3 full-trip, 4 custom) and hub bookings. Catalog setup: create the catalog **before** the guest journey (folders 11–18) because guests book against these records. Deletes live in **Teardown (99)**.

      Depends on: Auth (01). Feeds: guest transport (14/15), staff transport bookings (18). ⚠ `DELETE …/vehicles/:id` takes `propertyId` from the query string while the other fleet routes take it from the body.
  - name: 10 · App Banners
    description: |-
      Promotional/home banners shown in the guest app (`GET /api/guests/banners/active`, folder 14). Delete is a soft-delete (`isActive:false`) and lives in **Teardown (99)**.

      Depends on: Auth (01). Feeds: Guest App discovery (14).
  - name: 11 · Guest Management (creates the stay)
    description: |-
      Staff-side guest roster. **`POST /guests` is where a stay is born**: it creates the `Guest`, the linked `Booking` (the stay — its `bookingId` is *the* Booking ID quoted by every other hub), placeholder co-guests, and the `bookingToken` that the guest-app link carries.

      Depends on: Auth (01), property settings (04) optional. **Feeds nearly everything after it** — the Tests script stores `guestId`, `guestToken` (bookingToken), `stayDocId` (Booking `_id`), `stayBookingId` (`EB-YYYY-NNNNN`-style human ID) and `guestEmail`.

      Booking-ID convention (see backend `CLAUDE.md`): one stay = one `EB-YYYY-NNNNN`. The pre-request script generates a fresh `EB-<year>-9NNNN` so re-runs do not collide with seeded stays or with each other. If you omit `bookingId` the API falls back to a non-conforming `BK-<timestamp>-XXXX` — always send one. Running `npm run seed` wipes this test data.
  - name: 12 · Guest Check-in (public guest app)
    description: |-
      The guest-app pre-arrival flow behind the link `<GUEST_APP_URL>?token=<bookingToken>`: resolve token → consent → initialise session → upload ID(s) → submit for review. **No authentication** — the `bookingToken` (a 64-hex secret in the link) is the only credential, and after that requests are keyed by `guestId` / `checkInId`.

      Depends on: "Add guest (creates guest + stay)" in 11 (`guestToken`, `guestId`, `stayBookingId`). Upload + submit steps need object storage, so they are gated behind `enableUploads`. Staff review is folder 13.
  - name: 13 · Check-in Hub (staff review)
    description: |-
      Staff view of arrivals and ID review. Status per booking is *derived* from each guest's document state (not set directly). Reads first, then reviews, then room assignment.

      Depends on: Auth (01), a stay (11), and — for review — a submitted check-in (12). Per-guest document review needs an uploaded ID, so it is gated behind `enableUploads`.
  - name: 14 · Guest App — Session & Discovery (public)
    description: |-
      What the guest app calls after the link is opened: start a session, load profile/property/banners, then browse experiences, spa, transport and dining. **All public — no token.** Guest identity is just the `guestId` passed around.

      Depends on: a guest (11) and the staff catalog (05–10). Reads first, profile writes last.

      ⚠ `POST /api/guests/auth` is named like auth but **issues no token/session**: it upserts a guest by email and bumps `totalVisits`. Treat it as "identify guest".
  - name: 15 · Guest App — Bookings (public)
    description: |-
      Guest-created bookings for Experiences, Spa, Transport and Dining. All start `pending` and unpaid; payment (16) confirms them. **No auth** — everything is keyed by `guestId`.

      Depends on: guest (11/14) + catalog (05–09) + discovery reads (14).

      **Booking-ID linkage:** every guest-created booking here (Experience, Spa, Transport, Dining) has its `mainStayBookingId` derived **server-side** from the guest's stay — a value the client sends is never trusted, and none of these requests send one. So they always appear in Stay Activity (18.7) and the Checkout folio (21), like the staff hubs (18).
  - name: 16 · Payments (Razorpay)
    description: |-
      Online payment for **any** hub booking (Experience, Spa, Transport, Dining) — the endpoints look the booking up by Mongo `_id` across all four collections. Sequence: `create-order` → guest pays in Razorpay Checkout (client-side) → `verify` (or the `webhook` fires) → `status`. Verification flips the booking to paid **and confirms it** (`bookingStatus: confirmed` / spa `Upcoming` / dining+transport `confirmed`), notifies the guest and emails a confirmation.

      Depends on: a pending booking from folder 15 (`expBookingId`). **No authentication on any of these routes** (Razorpay calls the webhook server-to-server; the others are called by the guest app).

      Because the Checkout step cannot be scripted in Postman, `create-order`, `verify` and `webhook` are skipped unless `enableRazorpay` = `true`; if you enable them, paste the `razorpay_payment_id` / `razorpay_signature` produced by a real Checkout test payment into `rzpPaymentId` / `rzpSignature`. Only `status` runs unconditionally.
  - name: 17 · Legacy Experience Bookings (/api/bookings)
    description: |-
      An **older, experience-only booking API** (`booking.controller.js`) that overlaps with the guest flow in 15 (`POST /api/experiences/bookings`). It validates the guest/experience/slot/group size and computes price server-side, but does not set `mainStayBookingId`, and there is **no auth**. ⚠ **TODO (deferred):** because it omits `mainStayBookingId`, bookings created here are missing from Stay Activity and the Checkout folio — the same gap already fixed for every other guest booking path (README "Known gaps").

      ⚠ **Flag — I could not determine whether any client still uses this.** It is fully wired in `src/index.js`. Notably `PUT /:id/payment` lets any caller mark a booking `paid` with no Razorpay verification — verify before exposing publicly.

      Depends on: guest (11/14) + experience (05). Ends by cancelling its own booking so it does not disturb folders 18–21.
  - name: 18 · Staff-side Bookings by Hub (Add Booking dialogs)
    description: |-
      Everything staff do in the Experience, Spa, Dining (F&B) and Transport hubs once guests exist: list bookings, add manual bookings against a stay, mark paid, assign rooms. **Every "Add Booking" is linked to the stay by `mainStayBookingId` (`EB-…`)** — verified through `GET /bookings/lookup` first.

      Depends on: Auth (01), a stay (11) and the hub catalog (05–09). Cancellations are in **24**. The final request in this folder reads everything back per stay.

      **Hub-booking references:** every hub booking a server creates gets a ref of the form `<stayId>-<SPA|EXP|TRN|DIN>-<n>` (per-stay, per-kind counter), generated by the shared `src/utils/hubRef.js` — identical to the seed script. Staff can still type their own ref for Experience (`bookingId`) and Dining (`reservationRef`); it is kept as typed. The Stay Activity request asserts the format across every hub.
  - name: 19 · Service Requests (Guest "Write to Us" → Staff Requests Hub)
    description: |-
      A guest raises a request (form or AI chat); the **AI layer routes it to a department** from the live department list (falls back to the oldest department when the AI is unavailable); staff in that department see it, **accept** it (first accept wins, and only the acceptor/their manager/GM/Admin can complete it), reply, re-route and complete it. Guests are notified on accept/complete.

      Depends on: guest (11/14) and a department (02). Visibility is enforced from the JWT: department staff see only their department; **Admin/GM see everything** (these requests assume an Admin/GM token). There is deliberately **no free-form "set status"** endpoint.

      Lifecycle: `Pending` → (accept) `In-progress` → (complete) `Completed`. Re-routing an accepted ticket sends it back to `Pending`.
  - name: 20 · Guest Notifications
    description: |-
      In-app notifications shown in the guest app. Many are created automatically (booking pending/confirmed, check-in rejected, request accepted/completed); staff can also push one manually.

      Depends on: a guest (11). Staff create → guest list → mark read.
  - name: 21 · Checkout & Feedback
    description: |-
      **Checkouts tab:** departures for a day with a **folio assembled on every read** from what the guest actually booked across Spa, Experiences, Transport, Dining and in-room F&B (all linked by the shared stay ID), plus staff-added manual charges. Pending amount / "Needs approval" vs "Pre-approved" are **derived from each line's `paid` flag** — never stored. "Approve" is a staff attestation that marks every unpaid line paid at its source.

      **Feedback tab:** post-stay reviews and the Negative/Positive rating thresholds (sentiment is computed client-side from these).

      Depends on: a stay whose `checkoutDate` = the queried day (11 uses `{{checkoutDate}}`), plus bookings from 15/18 to populate the folio. Run **after** the bookings, before Cancellations (24) and Teardown (99). Stay dates are stored as UTC midnight, so a server running far west of UTC may bucket a departure into the previous local day.

      ⚠ **Flag:** no endpoint in this API lets a guest *submit* feedback (there is no route creating `Feedback`), so `GET /feedback` only shows seeded/externally-created reviews.
  - name: 22 · Home Summary & Analytics
    description: |-
      Read-only aggregations computed on every call from the collections that own the data (nothing is stored). Best run **after** the flow has produced data (bookings, requests, check-ins).

      Depends on: Auth (01). Request visibility in the summaries follows the caller's role (same scoping as the Requests Hub).
  - name: 23 · Comms Hub
    description: |-
      Staff can send a fully-rendered guest email template to a test address before switching the template on (templates themselves are stored in Property Settings → `comms`, folder 04).

      Depends on: Auth (01), Resend configured.
  - name: 24 · Cancellations
    description: |-
      All cancel/dismiss endpoints, run after the happy path. Placed after Checkout (21) so the earlier flow keeps its folio; cancelled items drop out of the folio.

      **Guest-side "cancel" endpoints use the `DELETE` verb but are soft-cancels** (status flip; nothing is deleted) and exist for "user dismissed the payment sheet". **Staff-side cancels** also email the acting staff member (fire-and-forget) — with `NOTIFY_EMAILS`/Resend configured that is a real email. Spa cancellation by staff is `PUT /spa/bookings/:id/status` with `Cancelled` (18.3).

      Depends on: the corresponding booking variables from 15 / 18.
  - name: 99 · Teardown (cleanup)
    description: |-
      Removes what the run created so the dev database is left as it was. **Disable by setting `enableTeardown` = `false`** (or dragging this folder out of the run) to keep the data for inspection. `npm run seed` also wipes everything, if you would rather do that.

      Ordered so nothing is refused: the guest delete **cascades** to the stay, check-ins, hub bookings, notifications and requests; staff before the department that holds them; dish → subcategory → category (which cascades).

      ⚠ Destructive. Only ever run against a development database.
paths:
  /health:
    get:
      tags:
        - 00 · Health
      summary: Health check
      description: |-
        Liveness probe served straight from `src/index.js`.

        **Type:** READ (no side effects)
        **Auth:** none (public route — no token required)
        **Depends on:** nothing beyond the collection variables being set
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                200 – Server is running:
                  summary: 200 – Server is running
                  value:
                    status: OK
                    message: Server is running
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples:
                500 – Server error (e.g. malformed id):
                  summary: 500 – Server error (e.g. malformed id)
                  value:
                    success: false
                    message: Request failed
                    error: Cast to ObjectId failed for value "not-an-id" (type string)
      security: []
  /api/auth/login:
    post:
      tags:
        - 01 · Staff Authentication
      summary: Login (issues authToken)
      description: |-
        Exchanges email + password for a JWT. **Tests script writes `authToken`, `staffId`, `staffTier`.**

        **Type:** WRITE (mutates state)
        **Auth:** none (public route — no token required)
        **Depends on:** a Staff account existing in the target database (see `npm run seed`); `staffEmail` / `staffPassword` collection variables set
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: '{{staffEmail}}'
                password: '{{staffPassword}}'
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                200 – Logged in:
                  summary: 200 – Logged in
                  value:
                    success: true
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.<payload>.<signature>
                    staff:
                      _id: 665f1c2a9b3e4a0000000092
                      firstName: Priya
                      lastName: Menon
                      email: admin@example.com
                      tier: Admin
                      isFounding: true
                      propertyId: default
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                400 – Missing field:
                  summary: 400 – Missing field
                  value:
                    success: false
                    message: Email and password are required
        '401':
          description: Unauthorized
          content:
            application/json:
              examples:
                401 – Unknown email:
                  summary: 401 – Unknown email
                  value:
                    success: false
                    message: No account found with this email address.
                    code: EMAIL_NOT_FOUND
                401 – Wrong password:
                  summary: 401 – Wrong password
                  value:
                    success: false
                    message: Incorrect password. Please try again.
                    code: WRONG_PASSWORD
                401 – No password set:
                  summary: 401 – No password set
                  value:
                    success: false
                    message: No password is set for this account. Ask an administrator to set one.
                    code: NO_PASSWORD_SET
        '403':
          description: Forbidden
          content:
            application/json:
              examples:
                403 – Deactivated:
                  summary: 403 – Deactivated
                  value:
                    success: false
                    message: This account has been deactivated. Contact your administrator.
                    code: ACCOUNT_DEACTIVATED
      security: []
  /api/auth/me:
    get:
      tags:
        - 01 · Staff Authentication
