        Handles `payment.captured` (→ `paymentStatus: paid`) and `payment.failed` (→ `failed`) by matching `razorpayOrderId` across the four booking collections. Needs live/test **Razorpay** credentials on the server (`RAZORPAY_KEY_ID/SECRET`) and a payment made through Razorpay Checkout, so it is **skipped unless `enableRazorpay` = `true`**.

        **Type:** WRITE (mutates state)
        **Auth:** none (public route — no token required)
        **Depends on:** Razorpay (server-to-server). Body must be byte-identical to what Razorpay signed.

        ⚠ **Flag:** not a client-callable endpoint. The signature is computed over `JSON.stringify(req.body)` (the *re-serialised* parsed body, not the raw bytes) with the API key secret — so it cannot be reproduced in Postman without the secret. Classified WRITE, external caller.
