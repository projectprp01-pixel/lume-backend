  /api/guests/auth:
    post:
      tags:
        - 14 · Guest App — Session & Discovery (public)
      summary: Identify guest (guest "auth")
      description: |-
        Finds a Guest by `email`. New → creates (`guestType: new`). Existing → updates `bookingToken`, `totalVisits += 1`, `guestType: returning`. Saves `guestId`.

        **Type:** WRITE (mutates state)
        **Auth:** none (public route — no token required)
        **Depends on:** "Add guest" (11) — reuses the guest with the same email; otherwise creates a new one

        ⚠ **Flag:** classified WRITE (upsert). No credential check — anyone knowing an email + any token string gets that guest's full document back, and a mismatched `bookingToken` **overwrites** the stored one.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                bookingToken: '{{guestToken}}'
                email: '{{guestEmail}}'
                fullName: Aarav Mehta
                mobileNumber: '9876543210'
                countryCode: '+91'
